<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | My Project</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f8fafc;
    color:#1f2937;
}

/* =====================
   Header
===================== */

header{
    background:#fff;
    box-shadow:0 2px 15px rgba(0,0,0,.05);
    position:sticky;
    top:0;
    z-index:1000;
}

nav{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 30px;
}

.logo{
    font-size:28px;
    font-weight:700;
    color:#2563eb;
}

nav ul{
    list-style:none;
    display:flex;
    gap:30px;
}

nav ul li a{
    text-decoration:none;
    color:#374151;
    font-weight:500;
    transition:.3s;
}

nav ul li a:hover,
nav ul li a.active{
    color:#2563eb;
}

/* =====================
   Register Section
===================== */

.container{
    max-width:1200px;
    margin:60px auto;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:100%;
    max-width:500px;
    background:#fff;
    border-radius:20px;
    padding:40px;
    border:1px solid #e5e7eb;
    box-shadow:0 15px 35px rgba(0,0,0,.08);
}

.card h1{
    text-align:center;
    font-size:34px;
    margin-bottom:10px;
    color:#111827;
}

.card p{
    text-align:center;
    color:#6b7280;
    margin-bottom:35px;
}

/* =====================
   Form
===================== */

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:500;
}

.input-box{
    position:relative;
}

.input-box i{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:#9ca3af;
}

.input-box input{
    width:100%;
    padding:14px 14px 14px 45px;
    border:1px solid #d1d5db;
    border-radius:12px;
    font-size:15px;
    transition:.3s;
    background:#fff;
}

.input-box input:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 4px rgba(37,99,235,.15);
}

/* Password Eye */

.password-toggle{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#6b7280;
}

/* Button */

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(37,99,235,.25);
}

/* Login */

.login-link{
    text-align:center;
    margin-top:25px;
    color:#6b7280;
}

.login-link a{
    color:#2563eb;
    text-decoration:none;
    font-weight:600;
}

.login-link a:hover{
    text-decoration:underline;
}

/* Footer */

footer{
    background:#fff;
    border-top:1px solid #e5e7eb;
    text-align:center;
    padding:20px;
    color:#6b7280;
}

/* Responsive */

@media(max-width:768px){

nav{
    flex-direction:column;
    gap:15px;
}

nav ul{
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
}

.card{
    padding:30px 20px;
}

.card h1{
    font-size:28px;
}

}

</style>

</head>
<body>

<header>

<nav>

<div class="logo">My Project</div>

<ul>
<li><a href="index.html">Home</a></li>
<li><a href="about.html">About</a></li>
<li><a href="contact.html">Contact</a></li>
<li><a href="feedback.html">Feedback</a></li>
<li><a href="register.html" class="active">Register</a></li>
</ul>

</nav>

</header>

<div class="container">

<div class="card">

<h1>Create Account</h1>

<p>Create your account and start using My Project today.</p>

<form action="register.php" method="post">

<div class="form-group">

<label>First Name</label>

<div class="input-box">

<i class="bi bi-person"></i>

<input
type="text"
name="fnm"
placeholder="Enter your first name"
required>

</div>

</div>

<div class="form-group">

<label>Last Name</label>

<div class="input-box">

<i class="bi bi-person"></i>

<input
type="text"
name="lnm"
placeholder="Enter your last name"
required>

</div>

</div>

<div class="form-group">

<label>Email Address</label>

<div class="input-box">

<i class="bi bi-envelope"></i>

<input
type="email"
name="email"
placeholder="Enter your email"
required>

</div>

</div>

<div class="form-group">

<label>Password</label>

<div class="input-box">

<i class="bi bi-lock"></i>

<input
type="password"
name="pass"
id="password"
placeholder="Create a password"
required>

<i class="bi bi-eye password-toggle" onclick="togglePassword()"></i>

</div>

</div>

<button type="submit" name="submit">

Create Account

</button>

</form>

<div class="login-link">

Already have an account?

<a href="login.html">Login</a>

</div>

</div>

</div>

<footer>

&copy; 2026 My Project. All Rights Reserved.

</footer>

<script>

function togglePassword(){

const password=document.getElementById("password");
const icon=document.querySelector(".password-toggle");

if(password.type==="password"){
password.type="text";
icon.classList.remove("bi-eye");
icon.classList.add("bi-eye-slash");
}
else{
password.type="password";
icon.classList.remove("bi-eye-slash");
icon.classList.add("bi-eye");
}

}

</script>

</body>
</html>
