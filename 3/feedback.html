<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feedback | My Project</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f8fafc;
    color:#1f2937;
}

/* ================= Header ================= */

header{
    background:#fff;
    box-shadow:0 2px 15px rgba(0,0,0,.05);
    position:sticky;
    top:0;
    z-index:1000;
}

nav{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 30px;
}

.logo{
    font-size:28px;
    font-weight:700;
    color:#2563eb;
}

nav ul{
    list-style:none;
    display:flex;
    gap:30px;
}

nav ul li a{
    text-decoration:none;
    color:#374151;
    font-weight:500;
    transition:.3s;
}

nav ul li a:hover,
nav ul li a.active{
    color:#2563eb;
}

/* ================= Main ================= */

.container{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:60px 20px;
}

.card{
    width:100%;
    max-width:650px;
    background:#fff;
    padding:40px;
    border-radius:20px;
    border:1px solid #e5e7eb;
    box-shadow:0 15px 35px rgba(0,0,0,.08);
}

.card h1{
    text-align:center;
    font-size:34px;
    margin-bottom:10px;
    color:#111827;
}

.card p{
    text-align:center;
    color:#6b7280;
    margin-bottom:35px;
}

/* ================= Form ================= */

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:500;
    color:#374151;
}

.input-box{
    position:relative;
}

.input-box i{
    position:absolute;
    left:15px;
    top:16px;
    color:#9ca3af;
    font-size:18px;
}

.input-box input,
.input-box textarea{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:12px;
    padding:14px 16px 14px 45px;
    font-size:15px;
    transition:.3s;
    resize:none;
    background:#fff;
}

.input-box textarea{
    min-height:160px;
}

.input-box input:focus,
.input-box textarea:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 4px rgba(37,99,235,.15);
}

/* ================= Button ================= */

button{
    width:100%;
    border:none;
    padding:15px;
    border-radius:12px;
    background:#2563eb;
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(37,99,235,.25);
}

/* ================= Footer ================= */

footer{
    text-align:center;
    padding:20px;
    color:#6b7280;
    background:#fff;
    border-top:1px solid #e5e7eb;
    margin-top:40px;
}

/* ================= Responsive ================= */

@media(max-width:768px){

nav{
    flex-direction:column;
    gap:15px;
}

nav ul{
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
}

.card{
    padding:30px 20px;
}

.card h1{
    font-size:28px;
}

}

</style>

</head>

<body>

<header>

<nav>

<div class="logo">My Project</div>

<ul>
<li><a href="index.html">Home</a></li>
<li><a href="about.html">About Us</a></li>
<li><a href="contact.html">Contact Us</a></li>
<li><a href="feedback.html" class="active">Feedback</a></li>
<li><a href="register.html">Register</a></li>
</ul>

</nav>

</header>

<div class="container">

<div class="card">

<h1>Feedback Form</h1>

<p>We'd love to hear your thoughts. Your feedback helps us improve.</p>

<form action="feedback.php" method="POST">

<div class="form-group">

<label>Username</label>

<div class="input-box">

<i class="bi bi-person"></i>

<input
type="text"
name="usn"
placeholder="Enter your username"
required>

</div>

</div>

<div class="form-group">

<label>Email Address</label>

<div class="input-box">

<i class="bi bi-envelope"></i>

<input
type="email"
name="em"
placeholder="Enter your email"
required>

</div>

</div>

<div class="form-group">

<label>Your Feedback</label>

<div class="input-box">

<i class="bi bi-chat-left-text"></i>

<textarea
name="fdm"
placeholder="Write your feedback here..."
required></textarea>

</div>

</div>

<button type="submit">

<i class="bi bi-send-fill"></i>
&nbsp; Submit Feedback

</button>

</form>

</div>

</div>

<footer>

&copy; 2026 My Project. All Rights Reserved.

</footer>

</body>
</html>
